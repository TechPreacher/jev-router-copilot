name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: model-router-copilot
    steps:
      - uses: actions/checkout@v5
      - name: Syntax
        run: |
          python3 --version
          python3 -I -m py_compile files/*.py tests/*.py
          bash -n install.sh uninstall.sh files/bin/routercp
      - name: Offline unit tests
        run: bash tests/run.sh

  test-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: model-router-copilot
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Syntax
        run: |
          python --version
          python -I -m py_compile (Get-ChildItem files/*.py, tests/*.py | ForEach-Object FullName)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Offline unit tests
        run: pwsh -NoProfile -File tests/run.ps1
